name: Verify GestaltX-AI

on:
  push:
    branches: [ai-only]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
      - name: Report selected Xcode
        run: xcodebuild -version
      - name: Run synthetic region and recovery tests
        run: |
          swiftc -o "$RUNNER_TEMP/AIRegionCoreTests" \
            GestaltX/AIRegionCore.swift tests/AIRegionCoreTests.swift
          "$RUNNER_TEMP/AIRegionCoreTests"
      - name: Compile iPhone Simulator app
        run: |
          xcodebuild -quiet -project GestaltX.xcodeproj -target GestaltX \
            -configuration Debug -sdk iphonesimulator \
            SYMROOT="$RUNNER_TEMP/simulator" \
            CODE_SIGNING_ALLOWED=NO DEVELOPMENT_TEAM="" build
      - name: Package development IPA
        id: build
        run: .github/scripts/build-ipa.sh "$RUNNER_TEMP/ipa"
      - name: Upload IPA for development inspection only
        uses: actions/upload-artifact@v7
        with:
          name: GestaltX-AI-${{ steps.build.outputs.version }}-unverified-device
          path: ${{ steps.build.outputs.ipa }}
          if-no-files-found: error
          retention-days: 7
